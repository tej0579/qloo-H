name: Build and Test IRL LootDrop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Lint & Health Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Check Imports & Syntax
        run: |
          python -c "import fastapi; import pydantic; import httpx; print('Backend dependencies OK')"

  frontend-build:
    name: Frontend Next.js Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package.json
      - name: Install Dependencies
        run: |
          cd web
          npm ci || npm install
      - name: Next.js Build
        run: |
          cd web
          npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
