<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Diamond -->
  <rect x="50" y="5" width="63.6" height="63.6" rx="10" transform="rotate(45 50 5)" fill="#0b0d14" stroke="url(#neonGrad)" stroke-width="4" filter="url(#glow)" />
  <!-- Inner Drop Box Hexagon -->
  <path d="M50,22 L75,37 L75,65 L50,80 L25,65 L25,37 Z" fill="#111420" stroke="#00f0ff" stroke-width="2.5" />
  <!-- Inner Cube Lines -->
  <path d="M50,22 L50,51 L75,65" fill="none" stroke="#9d4edd" stroke-width="2" />
  <path d="M25,65 L50,51" fill="none" stroke="#ff007f" stroke-width="2" />
  <!-- Center Energy Core -->
  <circle cx="50" cy="51" r="5" fill="#00f0ff" filter="url(#glow)" />
</svg>
